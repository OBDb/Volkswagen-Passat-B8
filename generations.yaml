generations:
  - name: "Passat B8"
    start_year: 2014
    end_year: 2022
    description: "The Volkswagen Passat B8 represents the eighth generation of the Passat lineup, unveiled on 3 July 2014 with sales commencing in November 2014 in Continental Europe and January 2015 in the United Kingdom. Built on Volkswagen's versatile MQB platform shared with numerous other Volkswagen Group products, this generation features clean, precise styling with a prominent horizontal grille, sharp character lines, and a more dynamic appearance than its predecessor while maintaining understated elegance. Available in four-door sedan and five-door wagon (Variant) body styles, the B8 Passat maintains efficient proportions with enhanced interior space. Engine options vary by market but typically include a range of turbocharged four-cylinder gasoline and diesel units, with innovations including a plug-in hybrid GTE variant combining a 1.4-liter TSI engine with an electric motor. Transmission choices center around DSG dual-clutch automatics for most variants, with manual options available on some engines and 4MOTION all-wheel drive on selected higher-powered models. The interior features a horizontal dashboard design with enhanced technology, including a digital instrument cluster and improved infotainment systems with enhanced connectivity. A mid-cycle update in 2019 brought revised styling and enhanced technology across the range. In China, the B8 continued to be sold under the name Magotan with an extended 80mm wheelbase. European production of the saloon variant ended in 2022, with the B9 generation succeeding it as an estate-only model in most markets."
